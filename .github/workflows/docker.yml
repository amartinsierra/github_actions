name: Docker

on:
  push:
  workflow_dispatch:
jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4
      - name: Comprobar secrets
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME está vacío"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "ERROR: DOCKER_PASSWORD está vacío"
            exit 1
          fi

          echo "DOCKER_USERNAME está configurado"
          echo "DOCKER_PASSWORD está configurado"
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/personas-python .


      - name: Publicar imagen
        run: docker push ${{ secrets.DOCKER_USERNAME }}/personas-python